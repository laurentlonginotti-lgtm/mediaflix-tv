name: Build Mediaflix APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Décode le keystore (stocké en secret base64) vers un fichier réel.
      # On nettoie d'abord les espaces/retours ligne parasites que le copier-coller
      # peut introduire dans la valeur du secret.
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::KEYSTORE_BASE64 secret manquant — build debug uniquement"
            exit 0
          fi
          echo "Longueur du secret base64 reçu : ${#KEYSTORE_BASE64} caractères"
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$GITHUB_WORKSPACE/release.jks"
          if [ ! -s "$GITHUB_WORKSPACE/release.jks" ]; then
            echo "::error::Le fichier décodé est vide — le secret KEYSTORE_BASE64 est invalide"
            exit 1
          fi
          SIZE=$(stat -c%s "$GITHUB_WORKSPACE/release.jks")
          echo "Keystore décodé : $SIZE octets"
          if [ "$SIZE" -lt 1000 ]; then
            echo "::error::Le keystore décodé fait $SIZE octets (attendu ~2750). Secret tronqué ?"
            exit 1
          fi

      # Build debug (toujours) — utilise le wrapper Gradle commité (pas d'action externe fragile)
      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      # Build release (seulement si le secret existe)
      - name: Build Release APK
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_FILE: ${{ github.workspace }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      # Nettoie le keystore même en cas d'échec
      - name: Cleanup keystore
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/release.jks"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Mediaflix-TV-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload Release APK
        if: ${{ hashFiles('app/build/outputs/apk/release/app-release.apk') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: Mediaflix-TV-release
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 90
