plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.mediaflix.tv'
    compileSdk 34

    defaultConfig {
        applicationId "com.mediaflix.tv"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    // Signature release pilotée par variables d'environnement
    // (en local : exporter les vars / en CI : injectées par GitHub Actions)
    signingConfigs {
        release {
            def storeFilePath = System.getenv("KEYSTORE_FILE") ?: "release.jks"
            storeFile file(storeFilePath)
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: ""
            keyAlias System.getenv("KEY_ALIAS") ?: "mediaflix"
            keyPassword System.getenv("KEY_PASSWORD") ?: System.getenv("KEYSTORE_PASSWORD") ?: ""
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // La signature ne s'applique que si la variable d'env existe
            if (System.getenv("KEYSTORE_PASSWORD")) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
